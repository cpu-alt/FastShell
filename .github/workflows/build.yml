# Builds and tests FastShell on Windows for every push and pull request.
# Pushing a tag "vX.Y.Z" (same as VERSION in CMakeLists.txt) also publishes
# the GitHub release with the Windows package and its SHA-256 checksum,
# which the installer and the in-app updater download.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # to publish the release on tags
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit   # powershell.exe is needed to zip the package
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-serialport
            mingw-w64-ucrt-x86_64-qt6-activeqt
            mingw-w64-ucrt-x86_64-libssh
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-gtest

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::CMakeLists.txt says VERSION $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          ./build/tests/fastshell_tests.exe
          ./build/tests/fastshell_session_tests.exe

      - name: Package
        run: bash tools/package.sh build package

      - uses: actions/upload-artifact@v4
        with:
          name: FastShell-windows-x64
          path: |
            package/*.zip
            package/*.sha256

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            package/*.zip
            package/*.sha256
          generate_release_notes: true
